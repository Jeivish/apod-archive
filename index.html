<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=JetBrains+Mono:wght@400&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>APOD Archive</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="wordmark">APOD Archive</div>
        <nav>
          <button type="button" class="btn" id="btn-prev" aria-label="Previous day">&larr;</button>
          <input type="date" id="date-input" min="1995-06-16" />
          <button type="button" class="btn" id="btn-next" aria-label="Next day">&rarr;</button>
          <button type="button" class="btn-random" id="btn-random">Random</button>
        </nav>
      </header>

      <main id="main-content"></main>

      <footer>
        <p>Data: <a href="https://apod.nasa.gov/" target="_blank" rel="noopener">NASA APOD</a></p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
